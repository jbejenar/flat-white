name: gnaf-loader Update Check

# Diagnostics and schedule recovery: docs/GNAF-LOADER-UPDATES.md

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 09:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check upstream without changing the submodule or opening a PR"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gnaf-loader-update
  cancel-in-progress: false

jobs:
  check-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the default branch when publishing an update
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Run with dry_run=true on a feature branch; publish updates from the default branch only."
          exit 1

      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Check upstream release and commit ancestry
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-gnaf-loader-update.mjs

      - name: Find an existing update PR
        id: existing
        if: steps.check.outputs.needs_update == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: chore/gnaf-loader-${{ steps.check.outputs.tag }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Respect open and deliberately closed updates. Never rewrite a PR
          # that a maintainer may have amended while reviewing the loader.
          PR_URL=$(gh pr list --repo "$GITHUB_REPOSITORY" --state all \
            --base "$BASE_BRANCH" --head "$UPDATE_BRANCH" \
            --json url,headRepositoryOwner \
            --jq 'map(select(.headRepositoryOwner.login == env.GITHUB_REPOSITORY_OWNER)) | .[0].url // empty')
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          if [[ -n "$PR_URL" ]]; then
            echo "Existing update PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare the verified submodule commit
        if: steps.check.outputs.needs_update == 'true' && inputs.dry_run != true && steps.existing.outputs.url == ''
        env:
          LATEST_SHA: ${{ steps.check.outputs.latest_sha }}
        run: git -C gnaf-loader checkout --detach "$LATEST_SHA"

      # This action also recovers a branch left behind by a failed PR creation.
      # GITHUB_TOKEN-created PR workflows may require maintainer approval.
      - name: Create update PR for review
        if: steps.check.outputs.needs_update == 'true' && inputs.dry_run != true && steps.existing.outputs.url == ''
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: gnaf-loader
          base: ${{ github.event.repository.default_branch }}
          branch: chore/gnaf-loader-${{ steps.check.outputs.tag }}
          commit-message: "chore: update gnaf-loader to ${{ steps.check.outputs.tag }}"
          title: "chore: update gnaf-loader to ${{ steps.check.outputs.tag }}"
          draft: true
          labels: dependencies
          body: |
            ## Summary

            Advances gnaf-loader from `${{ steps.check.outputs.current_desc }}` to upstream `${{ steps.check.outputs.tag }}`.

            - Current commit: `${{ steps.check.outputs.current_sha }}`
            - Proposed commit: `${{ steps.check.outputs.latest_sha }}`
            - The proposed commit contains the current pin in its history, preserving existing fixes.
            - [Upstream changes](https://github.com/minus34/gnaf-loader/compare/${{ steps.check.outputs.current_sha }}...${{ steps.check.outputs.latest_sha }})

            ## Test plan

            This PR starts as a draft: fixture CI validates flat-white's contract but does not run the upstream loader against a full G-NAF dataset.

            - [ ] Approve workflows to run if GitHub requests it, and confirm all CI checks pass.
            - [ ] Review upstream loader, settings, and raw/reference table changes for compatibility with flat-white's SQL and boundary preparation.
            - [ ] Add targeted committed fixtures for any relevant upstream schema changes; preserve byte-for-byte regression coverage.
            - [ ] Mark ready for review after the compatibility assessment.
